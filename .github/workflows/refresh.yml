name: Live Data Refresh

on:
  schedule:
    # This tells the cloud to wake up automatically every single day at 7:00 AM UTC
    - cron: '0 7 * * *'
  workflow_dispatch: # This adds a manual "Refresh Now" button so you can trigger updates instantly

jobs:
  refresh-dashboard:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code Base
      uses: actions/checkout@v4

    - name: Set Up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Stream Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install feedparser requests

    - name: Execute Live Scraper
      env:
        NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
      run: python fetch_news.py

    - name: Deploy Updated Index Live
      run: |
        git config --global user.name "GitHub Action Daemon"
        git config --global user.email "actions@github.com"
        git add index.html
        git diff --quiet && git diff --staged --quiet || (git commit -m "Automated Morning Briefing Update [Skip CI]" && git push)
