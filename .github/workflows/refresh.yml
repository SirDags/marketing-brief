name: Live Data Refresh

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch: 

jobs:
  refresh-dashboard:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code Base
      uses: actions/checkout@v4

    - name: Set Up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Stream Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install feedparser requests apify-client

    - name: Execute Live Scraper
      env:
        NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      run: python fetch_news.py

    - name: Deploy Updated Index Live
      run: |
        git config --global user.name "GitHub Action Daemon"
        git config --global user.email "actions@github.com"
        git add index.html
        git diff --quiet && git diff --staged --quiet || (git commit -m "Automated Morning Briefing Update [Skip CI]" && git push)